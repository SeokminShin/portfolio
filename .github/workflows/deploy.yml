name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main", "master"]
  # Validate lint / privacy / build before anything reaches the live site.
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keyed per ref so pull-request validation never queues behind a live deploy.
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: 'npm'

      # `static_site_generator: next` is deliberately NOT set. That input makes
      # the action write its own next.config.js from a blank template, which
      # Next then loads in preference to next.config.ts — silently discarding
      # everything this repo configures beyond basePath/output/images. All
      # three of those are declared explicitly in next.config.ts instead.
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check for private local paths
        run: npm run check:privacy

      - name: Build with Next.js
        run: npm run build

      # A green build is not proof the export is shaped correctly: when the
      # Pages action overwrote next.config.ts, `trailingSlash` vanished and the
      # build still succeeded while every trailing-slash URL 404'd. Assert the
      # shape we actually deploy.
      - name: Verify export shape
        run: |
          test -f out/research/index.html || { echo "::error::trailingSlash is not in effect - out/research/index.html missing"; exit 1; }
          test ! -f out/research.html     || { echo "::error::flat out/research.html emitted - next.config.ts was probably ignored"; exit 1; }
          test -f out/sitemap.xml         || { echo "::error::out/sitemap.xml missing"; exit 1; }
          echo "Export shape OK."

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
